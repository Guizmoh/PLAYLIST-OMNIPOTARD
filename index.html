<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omnipotard</title>
  <meta name="description" content="Écoute, note et commente les morceaux d'Omnipotard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e8643c'/%3E%3Cpath d='M12 9v11.2a3.5 3.5 0 1 0 2 3.1V13h6V9z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 4v11.2A3.5 3.5 0 1 0 11 18V8h6V4z"/></svg>
      </span>
      <span class="brand-name" id="siteTitle">Playlist</span>
    </a>
    <nav class="menu" id="menu" aria-label="Menu principal">
      <a href="#/" data-route="home">Morceaux</a>
      <a href="#/classement" data-route="classement">Classement</a>
      <a href="#/ajouter" data-route="ajouter" id="menuAdd" hidden>Ajouter</a>
      <a href="#/admin" data-route="admin" id="menuAdmin" hidden>Créateur</a>
    </nav>
    <div class="topbar-right">
      <span class="admin-pill" id="adminPill" hidden>Mode créateur</span>
      <a href="#/admin" class="icon-btn" id="adminLink" title="Espace créateur" aria-label="Espace créateur">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg>
      </a>
    </div>
  </header>

  <main id="app" class="container"></main>

  <!-- Lecteur fixe en bas de page -->
  <div class="player" id="player" hidden>
    <img class="player-cover" id="playerCover" alt="">
    <div class="player-info">
      <a class="player-title" id="playerTitle" href="#/"></a>
      <div class="player-artist" id="playerArtist"></div>
    </div>
    <button class="play-btn small" id="playerToggle" aria-label="Lecture / pause"></button>
    <div class="player-progress">
      <span class="time" id="playerCurrent">0:00</span>
      <div class="bar" id="playerBar"><div class="bar-fill" id="playerFill"></div></div>
      <span class="time" id="playerDuration">0:00</span>
    </div>
    <!-- Bandeau de commentaire rapide (quand on écoute sans être sur la page du morceau) -->
    <form class="player-comment" id="pcForm" hidden autocomplete="off">
      <button type="button" class="tc-chip" id="pcChip" title="Lier le commentaire à ce moment du morceau">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm1 4.5V12l3.5 2.1-.9 1.5L11 13V7.5z"/></svg><span id="pcTime">à 0:00</span>
      </button>
      <input id="pcBody" maxlength="2000" placeholder="Un avis sur ce morceau ? Critiques bienvenues…">
      <button class="btn" type="submit" id="pcSend">Envoyer</button>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <audio id="audio" preload="metadata"></audio>

  <script src="config.js?v=9"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
